<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroma de Barrio · Pide aquí</title>
<meta name="description" content="Carta digital de Aroma de Barrio. Elige, suma y pide por WhatsApp.">
<meta name="theme-color" content="#0b140f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aroma de Barrio">

<style>
  :root{
    --bg: #0b140f;
    --surface: #142019;
    --surface-2: #182a20;
    --border: rgba(230, 224, 210, 0.10);
    --border-strong: rgba(230, 224, 210, 0.16);
    --copper: #a86b3c;
    --text: #f3efe6;
    --text-muted: #a7b8ac;
    --text-faint: #6f8177;
    --cyan: #5fd0e0;
    --cyan-soft: rgba(95, 208, 224, 0.14);
    --gold: #d7ac63;
    --radius: 14px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding-bottom: calc(96px + var(--safe-bottom));
    background:
      radial-gradient(ellipse at top, #101d15 0%, var(--bg) 55%);
  }

  a { color: inherit; }

  /* ---------- Header ---------- */

  header.top {
    padding: 36px 20px 20px;
    text-align: center;
  }

  .brand-title {
    margin: 0;
    font-family: Georgia, "Times New Roman", "Iowan Old Style", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2.1rem, 8vw, 2.7rem);
    letter-spacing: 0.01em;
    color: var(--text);
    line-height: 1.1;
  }

  .brand-sub {
    margin: 8px 0 0;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .header-rule {
    width: 64px;
    height: 1px;
    background: var(--border-strong);
    margin: 20px auto 0;
  }

  /* ---------- Tabs ---------- */

  nav.tabs {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 6px;
    padding: 12px 16px;
    background: rgba(11, 20, 15, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }

  nav.tabs button {
    flex: 1;
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.95rem;
    font-family: inherit;
    padding: 10px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  nav.tabs button[aria-selected="true"] {
    color: var(--bg);
    background: var(--cyan);
    font-weight: 600;
  }

  nav.tabs button:not([aria-selected="true"]):active {
    background: var(--surface-2);
  }

  /* ---------- Menu ---------- */

  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 4px 16px 8px;
  }

  section.category {
    display: none;
  }

  section.category.active {
    display: block;
  }

  .cat-heading {
    text-align: center;
    color: var(--cyan);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 22px 0 14px;
  }

  .cat-heading::before,
  .cat-heading::after {
    content: "—";
    color: var(--text-faint);
    margin: 0 10px;
  }

  ul.product-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }

  .product {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--border);
  }

  .product-info {
    min-width: 0;
  }

  .product-name {
    font-size: 1rem;
    color: var(--text);
    line-height: 1.3;
  }

  .product-price {
    font-size: 0.86rem;
    color: var(--text-faint);
    margin-top: 3px;
  }

  .stepper {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 3px;
  }

  .stepper button {
    appearance: none;
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    font-size: 1.15rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .stepper button:active {
    background: var(--surface-2);
  }

  .stepper button.plus {
    color: var(--cyan);
  }

  .stepper button.plus:disabled,
  .stepper button.minus:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .stepper .qty {
    min-width: 22px;
    text-align: center;
    font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Loyalty card ---------- */

  .loyalty {
    margin: 30px 2px 8px;
    padding: 18px 16px;
    border: 1px solid var(--copper);
    border-radius: var(--radius);
    background: linear-gradient(160deg, rgba(168,107,60,0.10), transparent 60%);
    text-align: center;
  }

  .loyalty-title {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    color: var(--gold);
    font-size: 1.02rem;
    margin: 0 0 4px;
  }

  .loyalty-sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  .stamps {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stamp {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid var(--border-strong);
    color: var(--text-faint);
  }

  .stamp.filled {
    border-color: var(--cyan);
    background: var(--cyan-soft);
    color: var(--cyan);
  }

  .stamp svg { width: 16px; height: 16px; }

  /* ---------- Footer ---------- */

  footer.info {
    text-align: center;
    padding: 30px 16px 10px;
    color: var(--text-faint);
    font-size: 0.8rem;
    line-height: 1.7;
  }

  /* ---------- Order bar ---------- */

  .order-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 18px calc(14px + var(--safe-bottom));
    background: rgba(20, 32, 25, 0.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border-strong);
    transform: translateY(0);
    transition: transform 0.2s ease;
  }

  .order-bar.empty {
    transform: translateY(100%);
  }

  .order-total {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .order-total .label {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .order-total .amount {
    font-size: 1.25rem;
    font-weight: 600;
  }

  .order-btn {
    appearance: none;
    border: none;
    background: var(--cyan);
    color: #06201f;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 700;
    padding: 13px 22px;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .order-btn:active {
    opacity: 0.85;
  }

  .order-btn svg { width: 18px; height: 18px; }

  @media (min-width: 620px) {
    .order-bar > div.order-bar-inner,
    .order-bar {
      max-width: 560px;
      margin: 0 auto;
    }
  }
</style>
</head>
<body>

<header class="top">
  <h1 class="brand-title">Aroma de Barrio</h1>
  <p class="brand-sub">Cafetería · Desde 2015</p>
  <div class="header-rule"></div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>

<main id="menu"></main>

<div class="loyalty">
  <p class="loyalty-title">8 cafés sellados = el 9º gratis</p>
  <p class="loyalty-sub">Tu tarjeta de fidelidad: 5 de 8 sellos</p>
  <div class="stamps" id="stamps" aria-label="5 de 8 sellos conseguidos"></div>
</div>

<footer class="info">
  C/ Mayor 14 · Lun–Sáb 8:00–20:00<br>
  Pedidos por WhatsApp: 630 244 957
</footer>

<div class="order-bar empty" id="orderBar">
  <div class="order-total">
    <span class="label">TOTAL</span>
    <span class="amount" id="orderTotal">0,00 €</span>
  </div>
  <button class="order-btn" id="orderBtn" type="button">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0012.04 2zm0 18.15h-.01c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.18 8.18 0 01-1.25-4.38c0-4.52 3.68-8.2 8.2-8.2 2.19 0 4.25.85 5.8 2.4a8.15 8.15 0 012.4 5.8c0 4.52-3.68 8.24-8.15 8.24zm4.48-6.13c-.24-.12-1.44-.71-1.67-.79-.22-.08-.38-.12-.55.12-.16.24-.63.79-.78.95-.14.16-.28.18-.53.06-.24-.12-1.03-.38-1.96-1.21-.72-.65-1.21-1.44-1.35-1.68-.14-.24-.02-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.81-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.03 0 1.2.87 2.35.99 2.51.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/>
    </svg>
    Pedir
  </button>
</div>

<script>
(function () {
  "use strict";

  var WHATSAPP_NUMBER = "34630244957";

  var MENU = {
    bebidas: {
      label: "Bebidas",
      items: [
        { id: "cafe-leche", name: "Café con leche", price: 1.80 },
        { id: "cappuccino", name: "Cappuccino", price: 2.20 },
        { id: "cafe-solo", name: "Café solo", price: 1.50 },
        { id: "zumo-naranja", name: "Zumo de naranja natural", price: 2.50 },
        { id: "te-infusion", name: "Té / Infusión", price: 1.80 }
      ]
    },
    picar: {
      label: "Para picar",
      items: [
        { id: "tostada-tomate", name: "Tostada con tomate y aceite", price: 2.50 },
        { id: "croissant", name: "Croissant", price: 1.50 },
        { id: "bocadillo-jamon", name: "Bocadillo de jamón", price: 3.50 },
        { id: "napolitana-choc", name: "Napolitana de chocolate", price: 1.70 }
      ]
    }
  };

  var cart = {}; // id -> qty

  var tabsEl = document.getElementById("tabs");
  var menuEl = document.getElementById("menu");
  var orderBar = document.getElementById("orderBar");
  var orderTotalEl = document.getElementById("orderTotal");
  var orderBtn = document.getElementById("orderBtn");

  function formatPrice(n) {
    return n.toFixed(2).replace(".", ",") + " €";
  }

  function findItem(id) {
    var cats = Object.keys(MENU);
    for (var c = 0; c < cats.length; c++) {
      var items = MENU[cats[c]].items;
      for (var i = 0; i < items.length; i++) {
        if (items[i].id === id) return items[i];
      }
    }
    return null;
  }

  function buildTabs() {
    var cats = Object.keys(MENU);
    cats.forEach(function (catKey, idx) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.role = "tab";
      btn.textContent = MENU[catKey].label;
      btn.setAttribute("aria-selected", idx === 0 ? "true" : "false");
      btn.addEventListener("click", function () { selectCategory(catKey); });
      btn.dataset.cat = catKey;
      tabsEl.appendChild(btn);
    });
  }

  function buildMenu() {
    var cats = Object.keys(MENU);
    cats.forEach(function (catKey, idx) {
      var cat = MENU[catKey];
      var section = document.createElement("section");
      section.className = "category" + (idx === 0 ? " active" : "");
      section.dataset.cat = catKey;

      var heading = document.createElement("h2");
      heading.className = "cat-heading";
      heading.textContent = cat.label;
      section.appendChild(heading);

      var list = document.createElement("ul");
      list.className = "product-list";

      cat.items.forEach(function (item) {
        var li = document.createElement("li");
        li.className = "product";

        var info = document.createElement("div");
        info.className = "product-info";
        var name = document.createElement("div");
        name.className = "product-name";
        name.textContent = item.name;
        var price = document.createElement("div");
        price.className = "product-price";
        price.textContent = formatPrice(item.price);
        info.appendChild(name);
        info.appendChild(price);

        var stepper = document.createElement("div");
        stepper.className = "stepper";

        var minus = document.createElement("button");
        minus.type = "button";
        minus.className = "minus";
        minus.textContent = "−";
        minus.setAttribute("aria-label", "Quitar " + item.name);
        minus.disabled = true;

        var qty = document.createElement("span");
        qty.className = "qty";
        qty.textContent = "0";

        var plus = document.createElement("button");
        plus.type = "button";
        plus.className = "plus";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "Añadir " + item.name);

        minus.addEventListener("click", function () {
          changeQty(item.id, -1, qty, minus);
        });
        plus.addEventListener("click", function () {
          changeQty(item.id, 1, qty, minus);
        });

        stepper.appendChild(minus);
        stepper.appendChild(qty);
        stepper.appendChild(plus);

        li.appendChild(info);
        li.appendChild(stepper);
        list.appendChild(li);
      });

      section.appendChild(list);
      menuEl.appendChild(section);
    });
  }

  function changeQty(id, delta, qtyEl, minusEl) {
    var current = cart[id] || 0;
    var next = Math.max(0, current + delta);
    if (next === 0) {
      delete cart[id];
    } else {
      cart[id] = next;
    }
    qtyEl.textContent = String(next);
    minusEl.disabled = next === 0;
    updateOrderBar();
  }

  function selectCategory(catKey) {
    var tabButtons = tabsEl.querySelectorAll("button");
    tabButtons.forEach(function (b) {
      b.setAttribute("aria-selected", b.dataset.cat === catKey ? "true" : "false");
    });
    var sections = menuEl.querySelectorAll("section.category");
    sections.forEach(function (s) {
      s.classList.toggle("active", s.dataset.cat === catKey);
    });
  }

  function getTotal() {
    var total = 0;
    Object.keys(cart).forEach(function (id) {
      var item = findItem(id);
      if (item) total += item.price * cart[id];
    });
    return total;
  }

  function updateOrderBar() {
    var total = getTotal();
    var hasItems = Object.keys(cart).length > 0;
    orderTotalEl.textContent = formatPrice(total);
    orderBar.classList.toggle("empty", !hasItems);
  }

  function buildStamps() {
    var wrap = document.getElementById("stamps");
    var total = 8;
    var filled = 5;
    for (var i = 0; i < total; i++) {
      var span = document.createElement("span");
      span.className = "stamp" + (i < filled ? " filled" : "");
      if (i < filled) {
        span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 3h13v8a6.5 6.5 0 01-6.5 6.5h0A6.5 6.5 0 014 11V3z"/><path d="M17 6.5h1.5a2.5 2.5 0 010 5H17"/><path d="M4 20h13" stroke-linecap="round"/></svg>';
      }
      wrap.appendChild(span);
    }
  }

  function buildWhatsAppMessage() {
    var lines = ["Hola, Aroma de Barrio! Quiero pedir:"];
    var cats = Object.keys(MENU);
    cats.forEach(function (catKey) {
      MENU[catKey].items.forEach(function (item) {
        var qty = cart[item.id];
        if (qty) {
          lines.push("• " + qty + "x " + item.name + " — " + formatPrice(item.price * qty));
        }
      });
    });
    lines.push("");
    lines.push("Total: " + formatPrice(getTotal()));
    return lines.join("\n");
  }

  orderBtn.addEventListener("click", function () {
    if (Object.keys(cart).length === 0) return;
    var text = encodeURIComponent(buildWhatsAppMessage());
    var url = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + text;
    window.open(url, "_blank");
  });

  buildTabs();
  buildMenu();
  buildStamps();
  updateOrderBar();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        // Registro silencioso: la app sigue funcionando sin caché offline.
      });
    });
  }
})();
</script>

</body>
</html>
